<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mines - Cyborg</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #3b1f35 0%,
                    #1f2022 35%,
                    #121212 75%
                );

            color: #fff;

            padding: 20px;
        }

        .game {
            width: 100%;
            max-width: 1000px;

            margin: 0 auto;

            background: #1f2122;

            border: 1px solid #3a3c3d;

            border-radius: 18px;

            padding: 20px;

            box-shadow:
                0 20px 70px rgba(0, 0, 0, 0.6);
        }


        /* =========================================
           CABEÇALHO
        ========================================= */

        .header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 20px;
        }

        .title {
            font-size: 23px;

            font-weight: 700;
        }

        .title span {
            color: #ec6090;
        }

        .status {
            margin-top: 6px;

            color: #aaa;

            font-size: 13px;
        }


        /* =========================================
           SALDO
        ========================================= */

        .balance {
            min-width: 150px;

            padding: 12px 20px;

            background: #181a1b;

            border: 1px solid #343637;

            border-radius: 12px;

            text-align: center;
        }

        .balance-label {
            color: #888;

            font-size: 11px;

            font-weight: bold;

            letter-spacing: 1px;

            margin-bottom: 4px;
        }

        .balance-value {
            color: #ec6090;

            font-size: 22px;

            font-weight: 800;
        }


        /* =========================================
           MULTIPLICADOR
        ========================================= */

        .multiplier {
            min-width: 110px;

            color: #fff;

            font-size: 38px;

            font-weight: 800;

            text-align: right;

            white-space: nowrap;

            text-shadow:
                0 0 15px rgba(236, 96, 144, 0.45);
        }


        /* =========================================
           ÁREA DO MINES
        ========================================= */

        .mine-area {
            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px 0;
        }

        .grid {
            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 10px;

            width: min(100%, 600px);

            aspect-ratio: 1 / 1;
        }


        /* =========================================
           CASAS
        ========================================= */

        .cell {
            position: relative;

            border: 1px solid #3d4041;

            border-radius: 12px;

            background:
                linear-gradient(
                    145deg,
                    #292c2d,
                    #1a1c1d
                );

            color: #fff;

            font-size: 28px;

            cursor: pointer;

            transition:
                transform 0.15s,
                background 0.15s,
                box-shadow 0.15s;
        }

        .cell:hover:not(:disabled) {
            transform: translateY(-3px);

            background:
                linear-gradient(
                    145deg,
                    #353839,
                    #202324
                );

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.35);
        }

        .cell:disabled {
            cursor: default;
        }


        /* CASA SEGURA */

        .cell.safe {
            background:
                linear-gradient(
                    145deg,
                    #253d38,
                    #162824
                );

            border-color: #3e8d78;

            box-shadow:
                0 0 15px rgba(76, 193, 157, 0.18);
        }


        /* MINA */

        .cell.mine {
            background:
                linear-gradient(
                    145deg,
                    #542737,
                    #24171c
                );

            border-color: #ec6090;

            box-shadow:
                0 0 20px rgba(236, 96, 144, 0.25);
        }


        /* =========================================
           CONTROLES
        ========================================= */

        .controls {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

            margin-top: 10px;
        }

        .panel {
            background: #181a1b;

            border: 1px solid #343637;

            border-radius: 13px;

            padding: 15px;
        }

        .panel-title {
            margin-bottom: 10px;

            color: #999;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }


        /* =========================================
           INPUT
        ========================================= */

        .panel input,
        .panel select {
            width: 100%;

            margin-top: 6px;
            margin-bottom: 10px;

            padding: 12px;

            background: #111;

            border: 1px solid #3a3c3d;

            border-radius: 8px;

            color: #fff;

            font-size: 15px;

            outline: none;
        }

        .panel input:focus,
        .panel select:focus {
            border-color: #ec6090;
        }


        /* =========================================
           LABEL
        ========================================= */

        .panel label {
            display: block;

            color: #aaa;

            font-size: 13px;
        }


        /* =========================================
           BOTÕES
        ========================================= */

        .panel button {
            width: 100%;

            min-height: 45px;

            margin-top: 10px;

            padding: 12px;

            border: none;

            border-radius: 10px;

            background: #ec6090;

            color: #fff;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition:
                filter 0.15s,
                transform 0.1s;
        }

        .panel button:hover:not(:disabled) {
            filter: brightness(1.12);
        }

        .panel button:active:not(:disabled) {
            transform: scale(0.98);
        }

        .panel button:disabled {
            opacity: 0.4;

            cursor: not-allowed;
        }

        #cashout {
            background: #7357d9;
        }

        #resetBalance {
            background: #333638;
        }


        /* =========================================
           RESULTADO
        ========================================= */

        .result {
            margin-top: 12px;

            min-height: 36px;

            color: #fff;

            font-size: 22px;

            font-weight: 800;
        }

        .info {
            display: flex;

            justify-content: space-between;

            gap: 15px;

            margin-top: 15px;

            color: #888;

            font-size: 13px;
        }

        .info b {
            color: #fff;
        }


        /* =========================================
           VOLTAR
        ========================================= */

        .back {
            display: inline-block;

            margin-bottom: 15px;

            color: #aaa;

            font-size: 13px;

            text-decoration: none;
        }

        .back:hover {
            color: #ec6090;
        }


        /* =========================================
           RESPONSIVO
        ========================================= */

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .game {
                padding: 12px;
            }

            .header {
                flex-wrap: wrap;
            }

            .multiplier {
                font-size: 32px;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .grid {
                gap: 7px;
            }

            .cell {
                font-size: 22px;

                border-radius: 9px;
            }
        }

    </style>

</head>


<body>

    <div class="game">

        <a href="index.html" class="back">
            ← Voltar para os jogos
        </a>


        <!-- CABEÇALHO -->

        <div class="header">

            <div>

                <div class="title">
                    💣 <span>Mines</span>
                </div>

                <div class="status" id="status">
                    Pronto para iniciar
                </div>

            </div>


            <!-- SALDO -->

            <div class="balance">

                <div class="balance-label">
                    🪙 SALDO
                </div>

                <div class="balance-value" id="balance">
                    1000 pontos
                </div>

            </div>


            <!-- MULTIPLICADOR -->

            <div class="multiplier" id="multiplier">
                1.00x
            </div>

        </div>


        <!-- GRADE -->

        <div class="mine-area">

            <div class="grid" id="grid">

                <!-- CASAS GERADAS PELO JAVASCRIPT -->

            </div>

        </div>


        <!-- CONTROLES -->

        <div class="controls">


            <!-- CONFIGURAÇÕES -->

            <div class="panel">

                <div class="panel-title">
                    Configuração
                </div>


                <label for="bet">
                    Pontos da rodada
                </label>

                <input
                    id="bet"
                    type="number"
                    min="1"
                    step="1"
                    value="10"
                >


                <label for="mineCount">
                    Quantidade de minas
                </label>

                <select id="mineCount">

                    <option value="3">
                        3 minas
                    </option>

                    <option value="5">
                        5 minas
                    </option>

                    <option value="7">
                        7 minas
                    </option>

                </select>


                <button id="start">
                    💣 Iniciar Mines
                </button>


                <button
                    id="cashout"
                    disabled
                >
                    💰 Sacar pontos
                </button>


                <button id="resetBalance">
                    🔄 Restaurar 1.000 pontos
                </button>

            </div>


            <!-- RESULTADO -->

            <div class="panel">

                <div class="panel-title">
                    Resultado
                </div>

                <div
                    class="result"
                    id="result"
                >
                    —
                </div>

                <div class="info">

                    <span>
                        Pontos:
                        <b id="value">10</b>
                    </span>

                    <span>
                        Casas:
                        <b id="safeCount">0</b>
                    </span>

                </div>

            </div>

        </div>

    </div>


    <script>

        /* =========================================
           ELEMENTOS
        ========================================= */

        const grid =
            document.getElementById("grid");

        const balanceEl =
            document.getElementById("balance");

        const multiplierEl =
            document.getElementById("multiplier");

        const statusEl =
            document.getElementById("status");

        const resultEl =
            document.getElementById("result");

        const betInput =
            document.getElementById("bet");

        const mineCountSelect =
            document.getElementById("mineCount");

        const valueEl =
            document.getElementById("value");

        const safeCountEl =
            document.getElementById("safeCount");

        const startBtn =
            document.getElementById("start");

        const cashoutBtn =
            document.getElementById("cashout");

        const resetBalanceBtn =
            document.getElementById("resetBalance");


        /* =========================================
           VARIÁVEIS
        ========================================= */

        let balance = 1000;

        let running = false;

        let currentBet = 0;

        let mineCount = 3;

        let mines = [];

        let revealed = 0;

        let currentMultiplier = 1;


        /* =========================================
           MULTIPLICADORES
        ========================================= */

        const multipliers = [
            1.00,
            1.12,
            1.28,
            1.47,
            1.70,
            1.98,
            2.32,
            2.75,
            3.30,
            4.00,
            4.90,
            6.00,
            7.40,
            9.20,
            11.50,
            14.50,
            18.50,
            24.00,
            31.00,
            40.00,
            52.00,
            68.00
        ];


        /* =========================================
           SALDO
        ========================================= */

        function updateBalance() {

            balanceEl.innerHTML =
                "<span>"
                + Math.floor(balance)
                + "</span> pontos";

        }


        /* =========================================
           GERAR MINAS
        ========================================= */

        function generateMines() {

            mines = [];

            while (mines.length < mineCount) {

                const random =
                    Math.floor(Math.random() * 25);

                if (!mines.includes(random)) {
                    mines.push(random);
                }

            }

        }


        /* =========================================
           CRIAR GRID
        ========================================= */

        function createGrid() {

            grid.innerHTML = "";

            for (let i = 0; i < 25; i++) {

                const cell =
                    document.createElement("button");

                cell.className = "cell";

                cell.dataset.index = i;

                cell.textContent = "◆";

                cell.addEventListener(
                    "click",
                    () => revealCell(i, cell)
                );

                grid.appendChild(cell);

            }

        }


        /* =========================================
           RESET GRID
        ========================================= */

        function resetGrid() {

            const cells =
                document.querySelectorAll(".cell");

            cells.forEach(cell => {

                cell.disabled = false;

                cell.className = "cell";

                cell.textContent = "◆";

            });

            revealed = 0;

            safeCountEl.textContent = "0";

            currentMultiplier = 1;

            multiplierEl.textContent = "1.00x";

        }


        /* =========================================
           INICIAR
        ========================================= */

        function startGame() {

            if (running) return;

            const bet =
                Math.floor(Number(betInput.value));

            if (
                !Number.isFinite(bet) ||
                bet < 1
            ) {

                resultEl.textContent =
                    "⚠️ Digite pelo menos 1 ponto.";

                return;

            }

            if (bet > balance) {

                resultEl.textContent =
                    "⚠️ Você não tem pontos suficientes.";

                return;

            }


            currentBet = bet;

            mineCount =
                Number(mineCountSelect.value);


            balance -= currentBet;

            updateBalance();

            valueEl.textContent =
                currentBet;


            running = true;

            generateMines();

            resetGrid();


            startBtn.disabled = true;

            cashoutBtn.disabled = true;

            resetBalanceBtn.disabled = true;

            betInput.disabled = true;

            mineCountSelect.disabled = true;


            resultEl.textContent = "—";

            statusEl.textContent =
                "Encontre as casas seguras...";

        }


        /* =========================================
           REVELAR CASA
        ========================================= */

        function revealCell(index, cell) {

            if (!running) return;

            if (cell.disabled) return;


            cell.disabled = true;


            /* MINA */

            if (mines.includes(index)) {

                cell.classList.add("mine");

                cell.textContent = "💣";

                revealAllMines();

                loseGame();

                return;

            }


            /* CASA SEGURA */

            revealed++;

            cell.classList.add("safe");

            cell.textContent = "💎";

            safeCountEl.textContent =
                revealed;


            const multiplierIndex =
                Math.min(
                    revealed,
                    multipliers.length - 1
                );

            currentMultiplier =
                multipliers[multiplierIndex];


            multiplierEl.textContent =
                currentMultiplier.toFixed(2)
                + "x";


            cashoutBtn.disabled = false;


            statusEl.textContent =
                "Casa segura!";


            /*
                QUANDO TODAS AS CASAS
                SEGURAS FOREM ENCONTRADAS
            */

            if (revealed >= 25 - mineCount) {

                winGame();

            }

        }


        /* =========================================
           MOSTRAR TODAS AS MINAS
        ========================================= */

        function revealAllMines() {

            const cells =
                document.querySelectorAll(".cell");

            mines.forEach(index => {

                const cell = cells[index];

                if (!cell.classList.contains("mine")) {

                    cell.classList.add("mine");

                    cell.textContent = "💣";

                }

                cell.disabled = true;

            });

        }


        /* =========================================
           PERDEU
        ========================================= */

        function loseGame() {

            running = false;

            statusEl.textContent =
                "Você encontrou uma mina!";

            multiplierEl.textContent =
                "0.00x";

            resultEl.textContent =
                "💥 Perdeu "
                + currentBet
                + " pontos";


            startBtn.disabled = false;

            cashoutBtn.disabled = true;

            resetBalanceBtn.disabled = false;

            betInput.disabled = false;

            mineCountSelect.disabled = false;


            currentBet = 0;

            checkBalance();

        }


        /* =========================================
           SACAR
        ========================================= */

        function cashout() {

            if (!running) return;

            if (revealed < 1) return;


            const payout =
                Math.floor(
                    currentBet * currentMultiplier
                );


            balance += payout;

            running = false;


            statusEl.textContent =
                "Você sacou seus pontos!";


            resultEl.textContent =
                "✅ +"
                + payout
                + " pontos";


            startBtn.disabled = false;

            cashoutBtn.disabled = true;

            resetBalanceBtn.disabled = false;

            betInput.disabled = false;

            mineCountSelect.disabled = false;


            revealAllMines();


            currentBet = 0;

            updateBalance();

            checkBalance();

        }


        /* =========================================
           VITÓRIA
        ========================================= */

        function winGame() {

            running = false;


            const payout =
                Math.floor(
                    currentBet * currentMultiplier
                );


            balance += payout;


            statusEl.textContent =
                "Você encontrou todas as casas!";


            resultEl.textContent =
                "🏆 +"
                + payout
                + " pontos";


            startBtn.disabled = false;

            cashoutBtn.disabled = true;

            resetBalanceBtn.disabled = false;

            betInput.disabled = false;

            mineCountSelect.disabled = false;


            revealAllMines();


            currentBet = 0;

            updateBalance();

            checkBalance();

        }


        /* =========================================
           RESTAURAR SALDO
        ========================================= */

        resetBalanceBtn.addEventListener(
            "click",
            function() {

                if (running) return;


                balance = 1000;

                updateBalance();


                resultEl.textContent =
                    "🔄 Saldo restaurado";


                statusEl.textContent =
                    "Pronto para iniciar";


                multiplierEl.textContent =
                    "1.00x";


                safeCountEl.textContent =
                    "0";


                startBtn.disabled = false;

            }
        );


        /* =========================================
           INPUT
        ========================================= */

        betInput.addEventListener(
            "input",
            function() {

                const value =
                    Math.max(
                        0,
                        Math.floor(
                            Number(betInput.value) || 0
                        )
                    );


                valueEl.textContent =
                    value;

            }
        );


        /* =========================================
           BOTÕES
        ========================================= */

        startBtn.addEventListener(
            "click",
            startGame
        );

        cashoutBtn.addEventListener(
            "click",
            cashout
        );


        /* =========================================
           CHECK SALDO
        ========================================= */

        function checkBalance() {

            if (balance <= 0) {

                startBtn.disabled = true;

                statusEl.textContent =
                    "Você ficou sem pontos.";

                resultEl.textContent =
                    "🪙 Saldo zerado";

            } else {

                startBtn.disabled = false;

            }

        }


        /* =========================================
           INICIALIZAÇÃO
        ========================================= */

        createGrid();

        updateBalance();

        checkBalance();

    </script>

</body>

</html>
